<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrabajAR v2 — Oficios a domicilio</title>
<style>
  :root {
    --bg: #ffffff;
    --tile: #f3f3f3;
    --tile-hover: #e9e9e9;
    --ink: #0b0b0c;
    --muted: #6b6b6b;
    --line: #e8e8e8;
    --accent: #e5430a;
    --accent-soft: #fdece5;
    --ok: #0e8345;
    --ok-soft: #e6f4ec;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(0, 0, 0, .10);
    --tabbar-h: 62px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  h2 { font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  h3 { font-size: 16px; font-weight: 700; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ic { flex: none; display: block; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Shell ---------- */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1120px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
  .brand span { color: var(--accent); }
  .addr { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-weight: 600; padding: 8px 0; }
  .addr .ic:first-child { color: var(--accent); }
  .topnav { display: none; gap: 4px; }
  .topnav a { padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
  .topnav a:hover, .topnav a.active { background: var(--tile); color: var(--ink); }

  .container { max-width: 1120px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar-h) + 96px); }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--line);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .tabbar a.active { color: var(--ink); }
  .tabbar a.active .ic { stroke-width: 2.4; }
  body.immersive .tabbar { display: none; }
  body.immersive .container { padding-bottom: 120px; }

  /* ---------- Primitives ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 20px; border-radius: 12px;
    background: var(--ink); color: #fff; font-weight: 700; font-size: 16px;
  }
  .btn:hover { background: #2a2a2c; }
  .btn:disabled { background: var(--tile); color: #a8a8a8; cursor: not-allowed; }
  .btn.block { display: flex; width: 100%; }
  .btn.light { background: var(--tile); color: var(--ink); }
  .btn.light:hover { background: var(--tile-hover); }
  .btn.sm { min-height: 36px; padding: 0 14px; font-size: 13px; border-radius: 999px; }
  .btn.danger { background: none; color: #c0271a; }
  .btn .right { margin-left: auto; }

  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; flex: none; }
  .round:hover { background: var(--tile-hover); }
  .round.float { background: #fff; box-shadow: var(--shadow); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
    padding: 9px 14px; border-radius: 999px; background: var(--tile); font-size: 14px; font-weight: 600;
  }
  .chip:hover { background: var(--tile-hover); }
  .chip.on { background: var(--ink); color: #fff; }
  .hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll > * { scroll-snap-align: start; scroll-margin-left: 16px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 8px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--tile); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.hot { background: var(--accent-soft); color: var(--accent); }

  .avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--ink); color: #fff; }
  .avatar.sm { width: 36px; height: 36px; font-size: 13px; }
  .avatar.lg { width: 84px; height: 84px; font-size: 26px; border: 4px solid #fff; }
  .star { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
  .star .ic { fill: currentColor; }

  .section { margin-top: 32px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-head a { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 2px; }

  .row { display: flex; align-items: center; gap: 14px; padding: 14px 0; width: 100%; text-align: left; }
  .rowlist > * + * { border-top: 1px solid var(--line); }
  .divider { height: 8px; background: var(--tile); margin: 20px -16px; }

  .pagehead { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty h2 { color: var(--ink); margin-bottom: 6px; }
  .empty .btn { margin-top: 20px; }

  .input { width: 100%; min-height: 52px; padding: 14px 16px; border-radius: 12px; border: 2px solid transparent; background: var(--tile); }
  .input:focus { outline: none; border-color: var(--ink); background: #fff; }
  textarea.input { min-height: 96px; resize: vertical; }

  .searchpill { position: relative; display: block; }
  .searchpill .ic { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); }
  .searchpill .input { border-radius: 999px; padding-left: 50px; min-height: 56px; font-size: 17px; font-weight: 600; }
  .searchpill .input::placeholder { color: var(--ink); opacity: .75; }

  /* ---------- Home ---------- */
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cat { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-align: center; }
  .cat i { width: 100%; aspect-ratio: 1.15; border-radius: var(--radius); background: var(--tile); display: grid; place-items: center; transition: transform .15s, background .15s; }
  .cat:hover i { background: var(--tile-hover); transform: scale(.97); }
  .cat.soon { color: var(--muted); }
  .cat.soon i { background: none; border: 2px dashed var(--line); }

  .promo { flex: none; width: min(84%, 340px); min-height: 132px; border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; background: var(--tile); }
  .promo b { font-size: 19px; line-height: 1.2; letter-spacing: -.01em; display: block; }
  .promo p { font-size: 13px; opacity: .8; margin-top: 4px; }
  .promo .btn { align-self: flex-start; }
  .promo.dark { background: var(--ink); color: #fff; }
  .promo.dark .btn { background: #fff; color: var(--ink); }
  .promo.accent { background: var(--accent); color: #fff; }
  .promo.accent .btn { background: #fff; color: var(--ink); }

  .tilecard { flex: none; width: 232px; display: flex; flex-direction: column; gap: 2px; }
  .tilecard .cover { position: relative; height: 124px; border-radius: var(--radius); background: var(--tile); display: grid; place-items: center; margin-bottom: 8px; color: #b9b9b9; }
  .tilecard .cover .avatar { position: absolute; left: 12px; bottom: 12px; width: 44px; height: 44px; font-size: 14px; }
  .tilecard .cover .tag { position: absolute; right: 10px; top: 10px; background: #fff; color: var(--ink); }
  .tilecard .name { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 16px; }

  .again { flex: none; width: 260px; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius); background: var(--tile); }
  .again i, .thumb { flex: none; width: 48px; height: 48px; border-radius: 12px; background: #fff; display: grid; place-items: center; }

  .prorow { display: flex; gap: 14px; padding: 14px 0; align-items: center; }
  .prorow .thumb { width: 76px; height: 76px; border-radius: var(--radius); background: var(--tile); position: relative; }
  .prorow .thumb .avatar { width: 46px; height: 46px; font-size: 14px; }
  .prorow .name { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; }
  .prorow .line { display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 14px; color: var(--muted); }
  .prorow .line .star { color: var(--ink); }
  .prolist > * + * { border-top: 1px solid var(--line); }

  /* ---------- Live order bar ---------- */
  .livebar {
    position: fixed; z-index: 29; left: 12px; right: 12px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius);
    background: var(--ink); color: #fff; box-shadow: var(--shadow);
  }
  .livebar small { display: block; opacity: .7; }
  .livebar .pulse { width: 10px; height: 10px; border-radius: 50%; background: #3ddc84; animation: pulse 1.6s infinite; flex: none; }
  body.immersive .livebar { display: none; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(61, 220, 132, .6); } to { box-shadow: 0 0 0 10px rgba(61, 220, 132, 0); } }

  .segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  .segs i { height: 5px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
  .segs i.done { background: var(--ink); }
  .segs i.cur::after { content: ""; position: absolute; inset: 0; width: 50%; background: var(--ink); border-radius: inherit; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(200%); } }

  /* ---------- Professional ---------- */
  .cover-lg { height: 132px; margin: -16px -16px 0; background: var(--tile); display: grid; place-items: center; color: #cfcfcf; position: relative; }
  .cover-lg .round { position: absolute; left: 12px; top: 12px; }
  .pro-head { margin-top: -42px; position: relative; }
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .pills > div { background: var(--tile); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .pills b { display: flex; justify-content: center; font-size: 16px; }
  .pills span { font-size: 12px; color: var(--muted); }
  .svc { display: flex; align-items: center; gap: 14px; padding: 16px 0; width: 100%; text-align: left; }
  .svc .add { width: 36px; height: 36px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; flex: none; transition: background .15s; }
  .svc.on .add { background: var(--ink); color: #fff; }
  .bars { display: grid; gap: 4px; flex: 1; }
  .bars div { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .bars i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bars i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--ink); }
  .review { padding: 14px 0; }

  .cartbar { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .cartbar .btn { max-width: 560px; margin: 0 auto; }
  .cartbar .count { background: rgba(255, 255, 255, .2); border-radius: 6px; padding: 1px 8px; font-size: 14px; }

  /* ---------- Checkout ---------- */
  .narrow { max-width: 620px; margin: 0 auto; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--tile); padding: 4px; border-radius: 12px; }
  .seg2 button { min-height: 44px; border-radius: 9px; font-weight: 700; }
  .seg2 button.on { background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c4c4c4; flex: none; }
  .on > .radio { border: 7px solid var(--ink); }
  .sum > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .sum .total { font-weight: 800; font-size: 18px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }

  /* ---------- Tracking ---------- */
  .trk-map { position: sticky; top: 0; height: 46vh; height: 46dvh; background: #eef0f2; z-index: 1; }
  .trk-map svg { width: 100%; height: 100%; display: block; }
  .trk-map .round { position: absolute; left: 12px; top: 12px; }
  .trk-sheet {
    position: relative; z-index: 2; margin-top: -22px; background: var(--bg); border-radius: 22px 22px 0 0;
    padding: 26px 16px 40px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .10); min-height: 60vh;
  }
  .trk-sheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 999px; background: #d4d4d4; }
  .eta { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .pin { display: flex; gap: 6px; }
  .pin b { width: 34px; height: 42px; border-radius: 8px; background: var(--tile); display: grid; place-items: center; font-size: 20px; }
  .plate { display: inline-block; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 6px; font-weight: 800; font-size: 13px; letter-spacing: .04em; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { position: relative; padding: 0 0 20px 30px; color: #a3a3a3; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ""; position: absolute; left: 3px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #d4d4d4; z-index: 1; }
  .steps li::after { content: ""; position: absolute; left: 8px; top: 16px; bottom: -4px; width: 2px; background: var(--line); }
  .steps li:last-child::after { display: none; }
  .steps li.done { color: var(--ink); }
  .steps li.done::before, .steps li.done::after { background: var(--ink); }
  .steps li.cur { color: var(--ink); font-weight: 700; }
  .steps li.cur::before { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
  .steps time { float: right; font-weight: 400; font-size: 13px; color: var(--muted); }
  .demo { border: 1.5px dashed #cfcfcf; border-radius: var(--radius); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 24px; }
  .demo span { flex: 1; min-width: 150px; font-size: 12px; color: var(--muted); }
  #worker { transition: transform .5s linear; }
  .radar { animation: radar 1.8s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  .radar.d2 { animation-delay: .9s; }
  @keyframes radar { from { transform: scale(.3); opacity: .5; } to { transform: scale(1); opacity: 0; } }

  /* ---------- Rating ---------- */
  .rate { text-align: center; }
  .rate .avatar { margin: 0 auto 14px; border: 0; }
  .starinput { display: flex; justify-content: center; gap: 4px; margin: 24px 0 8px; }
  .starinput button { padding: 4px; color: #dcdcdc; transition: transform .1s; }
  .starinput button:active { transform: scale(.9); }
  .starinput button .ic { fill: currentColor; }
  .starinput button.on { color: var(--ink); }
  .ratelabel { min-height: 24px; font-weight: 700; font-size: 17px; }
  .rate .wrap { justify-content: center; }
  .rate h3 { margin: 28px 0 12px; }

  /* ---------- Account ---------- */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick a { background: var(--tile); border-radius: var(--radius); padding: 18px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .quick a:hover { background: var(--tile-hover); }

  /* ---------- Sheet / toast ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { width: 100%; max-width: 520px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s ease-out; max-height: 88vh; overflow: auto; }
  .modal header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -20px); z-index: 60; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Breakpoints ---------- */
  @media (min-width: 640px) {
    .cats { grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .cat { font-size: 14px; }
    .prolist { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; }
    .prolist > *:nth-child(2) { border-top: 0; }
    .cover-lg { margin: 0; border-radius: var(--radius); }
    .pro-head { padding: 0 16px; }
    .overlay { align-items: center; }
    .modal { border-radius: 22px; }
  }
  @media (min-width: 900px) {
    h1 { font-size: 36px; }
    .topbar-inner { height: 64px; padding: 0 24px; gap: 20px; }
    .topnav { display: flex; }
    .addr { flex: none; max-width: 280px; margin-left: auto; background: var(--tile); padding: 8px 14px; border-radius: 999px; }
    .tabbar { display: none; }
    .container, body.immersive .container { padding: 32px 24px 96px; }
    .hscroll { margin: 0; padding: 0 0 4px; }
    .hscroll > * { scroll-margin-left: 0; }
    .divider { margin: 24px 0; height: 1px; background: var(--line); }
    .cover-lg { margin: 0; border-radius: var(--radius); }
    .pro-head { padding: 0 16px; }
    .livebar { left: auto; right: 24px; bottom: 24px; width: 380px; }
    .cartbar { background: none; border: 0; pointer-events: none; padding-bottom: 24px; }
    .cartbar .btn { pointer-events: auto; box-shadow: var(--shadow); }
    .trk { display: flex; height: calc(100vh - 65px); }
    .trk-map { flex: 1; height: auto; position: relative; }
    .trk-map .round { display: none; }
    .trk-sheet { order: -1; width: 440px; flex: none; margin: 0; border-radius: 0; box-shadow: none; border-right: 1px solid var(--line); overflow: auto; padding: 28px 24px; min-height: 0; }
    .trk-sheet::before { display: none; }
    .toast { top: 80px; }
  }
  @media (max-width: 899px) { body[data-route="seguimiento"] .topbar { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">Trabaj<span>AR</span></a>
    <nav class="topnav" aria-label="Principal">
      <a href="#/" data-nav="home">Inicio</a>
      <a href="#/buscar" data-nav="buscar">Buscar</a>
      <a href="#/actividad" data-nav="actividad">Actividad</a>
    </nav>
    <button class="addr" data-action="addr-sheet" id="addrBtn" aria-label="Cambiar domicilio"></button>
    <a class="avatar sm" href="#/cuenta" aria-label="Cuenta">AD</a>
  </div>
</header>

<main id="view"></main>
<div id="live"></div>
<nav class="tabbar" aria-label="Principal" id="tabbar"></nav>
<div class="overlay" id="overlay" data-action="close-sheet"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Icons ---------- */
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  list: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',

function renderSearchBody() {
  const f = state.filters;
  $('#chips').innerHTML = `
    <button class="chip" data-action="sort-sheet">${icon('sliders', 16)}${SORTS[f.sort]}${icon('down', 14)}</button>
    <button class="chip ${f.available ? 'on' : ''}" data-action="toggle" data-key="available" aria-pressed="${f.available}">Disponible ahora</button>
    <button class="chip ${f.verified ? 'on' : ''}" data-action="toggle" data-key="verified" aria-pressed="${f.verified}">Verificados</button>
    ${CATEGORIES.map((c) => `<button class="chip ${f.cat === c.id ? 'on' : ''}" data-action="filter-cat" data-cat="${c.id}" aria-pressed="${f.cat === c.id}">${c.name}</button>`).join('')}`;
  const tokens = norm(f.q).split(/\s+/).filter(Boolean);
  const list = PROS.filter((p) => {
    if (f.cat && p.cat !== f.cat) return false;
    if (f.available && !p.available) return false;
    if (f.verified && !p.verified) return false;
    const hay = norm([p.name, catById(p.cat).name, ...p.services.map((s) => s[0])].join(' '));
    return tokens.every((t) => hay.includes(t));
  }).sort((a, b) => (f.sort === 'rating' ? b.rating - a.rating : a[f.sort] - b[f.sort]));
  $('#count').textContent = `${list.length} ${list.length === 1 ? 'profesional' : 'profesionales'}${f.cat ? ' en ' + catById(f.cat).name : ''}`;
  $('#results').innerHTML = list.length
    ? list.map(proRow).join('')
    : `<div class="empty" style="grid-column:1/-1"><h2>Sin resultados</h2><p>Probar con otro término o quitar filtros.</p><button class="btn light" data-action="clear-filters">Quitar filtros</button></div>`;
}

function mapSvg() {
  const blocks = [];
  for (let j = 0; j < 5; j++) for (let i = 0; i < 7; i++) {
    const park = (i === 4 && j === 3) || (i === 1 && j === 0);
    blocks.push(`<rect x="${16 + i * 112}" y="${16 + j * 116.8}" width="96" height="100.8" rx="5" fill="${park ? '#d5ecd4' : '#e4e7ea'}"/>`);
  }
  const d = 'M120 124.8V358.4H456V241.6H680';
  return `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mapa con el recorrido del profesional hasta el domicilio">
    <rect width="800" height="600" fill="#fff"/>${blocks.join('')}
    <path id="route" d="${d}" fill="none" stroke="#bdbdbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="routeDone" d="${d}" fill="none" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(680 241.6)">
      <g id="radar"><circle class="radar" r="90" fill="#0b0b0c"/><circle class="radar d2" r="90" fill="#0b0b0c"/></g>
      <rect x="-13" y="-13" width="26" height="26" rx="5" fill="#0b0b0c"/><rect x="-4" y="-4" width="8" height="8" fill="#fff"/>
    </g>
    <g id="worker"><circle r="17" fill="#fff"/><circle r="13" fill="#e5430a"/><circle r="4.5" fill="#fff"/></g>
  </svg>`;
}

/* ---------- Live order (simulation) ---------- */
let tripTimer = null;
let routeLen = 0;

function paintLive() {
  const a = state.active;
  if (!a) return;
  document.querySelectorAll('[data-eta]').forEach((el) => (el.textContent = `${tripMins()} min`));
  const route = $('#route');
  if (!route) return;
  const pt = route.getPointAtLength(routeLen * a.progress);
  $('#worker').style.transform = `translate(${pt.x}px, ${pt.y}px)`;
  $('#worker').style.display = a.step >= 1 ? '' : 'none';
  $('#radar').style.display = a.step === 0 ? '' : 'none';
  route.style.display = $('#routeDone').style.display = a.step >= 1 ? '' : 'none';
  $('#routeDone').style.strokeDashoffset = -routeLen * a.progress;
}

function initTracking() {
  const route = $('#route');
  if (!route) return;
  routeLen = route.getTotalLength();
  $('#routeDone').style.strokeDasharray = routeLen;
  const worker = $('#worker');
  worker.style.transition = 'none';
  paintLive();
  requestAnimationFrame(() => requestAnimationFrame(() => (worker.style.transition = '')));
}

function syncTimer() {
  const running = state.active && state.active.step === 2;
  if (running && !tripTimer) {
    tripTimer = setInterval(() => {
      const a = state.active;
      a.progress = Math.min(1, a.progress + 0.5 / TRIP_SECONDS);
      paintLive();
      if (a.progress >= 1) setStep(3);
    }, 500);
  } else if (!running && tripTimer) {
    clearInterval(tripTimer);
    tripTimer = null;
  }
}

function setStep(n) {
  const a = state.active;
  a.step = n;
  a.times[n] = nowTime();
  if (n < 2) a.progress = 0;
  if (n >= 3) a.progress = 1;
  syncTimer();
  toast(STEPS[n]);
  // Avoid wiping forms the user may be filling in on other screens.
  if (['', 'seguimiento', 'actividad'].includes(currentRoute())) render();
  else renderLiveBar();
}

function renderLiveBar() {
  const a = state.active;
  if (!a) return ($('#live').innerHTML = '');
  const name = firstName(proById(a.proId).name);
  const done = a.step === 5;
  $('#live').innerHTML = `<a class="livebar" href="${done ? '#/calificar/active' : '#/seguimiento'}">
    ${done ? icon('star') : '<i class="pulse"></i>'}
    <span class="grow"><b>${done ? `Calificar a ${name}` : a.step === 2 ? `${name} llega en <span data-eta></span>` : STEPS[a.step]}</b><small class="ellipsis">${esc(a.items[0][0])}</small></span>
    ${icon('next')}</a>`;
  paintLive();
}

const TABS = [['home', '#/', 'Inicio', 'home'], ['buscar', '#/buscar', 'Buscar', 'search'], ['actividad', '#/actividad', 'Actividad', 'list'], ['cuenta', '#/cuenta', 'Cuenta', 'user']];

const IMMERSIVE = ['pro', 'checkout', 'seguimiento', 'calificar'];

  const view = $('#view');
  view.className = route === 'seguimiento' ? '' : 'container';
  view.innerHTML = (views[route] || notFound)(param);
  document.body.dataset.route = route;
  document.body.classList.toggle('immersive', IMMERSIVE.includes(route));
  document.querySelectorAll('[data-nav]').forEach((el) => el.classList.toggle('active', el.dataset.nav === NAV_OF[route]));
  $('#addrBtn').innerHTML = `${icon('pin', 18)}<span class="ellipsis">${ADDRESSES[state.addr].text}</span>${icon('down', 16)}`;
  if (route === 'buscar') renderSearchBody();

const single = (container, el) => document.querySelectorAll(`${container} > *`).forEach((c) => c.classList.toggle('on', c === el));
const resetFilters = (patch) => (state.filters = { q: '', cat: '', sort: 'rating', available: false, verified: false, ...patch });

const actions = {
  back: () => (history.length > 1 ? history.back() : (location.hash = '#/')),
  say: (el, e) => { if (el.tagName === 'A') e.preventDefault(); toast(el.dataset.msg); },
  'close-sheet': (el, e) => { if (e.target === el || el.hasAttribute('data-force')) closeSheet(); },

  cat: (el) => resetFilters({ cat: el.dataset.cat }),
  urgent: () => resetFilters({ available: true, sort: 'km' }),
  'only-verified': () => resetFilters({ verified: true }),
  'clear-filters': () => { resetFilters(); $('#q').value = ''; renderSearchBody(); },
  'filter-cat': (el) => { state.filters.cat = state.filters.cat === el.dataset.cat ? '' : el.dataset.cat; renderSearchBody(); },
  toggle: (el) => { state.filters[el.dataset.key] = !state.filters[el.dataset.key]; renderSearchBody(); },
  'sort-sheet': () => openSheet('Ordenar por', `<div class="rowlist">${Object.entries(SORTS).map(([k, v]) => `<button class="row ${state.filters.sort === k ? 'on' : ''}" data-action="set-sort" data-v="${k}"><span class="grow">${v}</span><span class="radio"></span></button>`).join('')}</div>`),
  'set-sort': (el) => { state.filters.sort = el.dataset.v; closeSheet(); renderSearchBody(); },

  'addr-sheet': () => openSheet('Domicilio del servicio', `<div class="rowlist">${ADDRESSES.map((x, i) => `<button class="row ${state.addr === i ? 'on' : ''}" data-action="set-addr" data-i="${i}"><span class="round">${icon(i ? 'list' : 'home')}</span><span class="grow"><b>${x.label}</b><div class="small muted">${x.text}</div></span><span class="radio"></span></button>`).join('')}</div><button class="btn light block" style="margin-top:12px" data-action="say" data-msg="Agregar domicilio (demostración)">${icon('plus', 18)}Agregar domicilio</button>`),
  'set-addr': (el) => { state.addr = Number(el.dataset.i); closeSheet(); render(); },

  pick: (el) => {
    const proId = Number(el.dataset.pro), i = Number(el.dataset.i);
    if (state.cart.proId !== proId) state.cart = { proId, items: [] };
    const items = state.cart.items;
    items.includes(i) ? items.splice(items.indexOf(i), 1) : items.push(i);
    const on = items.includes(i);
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on);
    el.querySelector('.add').innerHTML = icon(on ? 'check' : 'plus', 18);
    $('#cartbar').innerHTML = cartBar(proById(proId));
  },
  when: (el) => {
    state.checkout.when = el.dataset.v;
    single('#when', el);
    $('#slots').style.display = el.dataset.v === 'later' ? '' : 'none';
    $('#whenNote').style.display = el.dataset.v === 'now' ? '' : 'none';
  },
  slot: (el) => single('#slots', el),
  pay: (el) => { state.checkout.pay = Number(el.dataset.i); single('#pay', el); },

  advance: () => state.active.step < 5 && setStep(state.active.step + 1),
  restart: () => { state.active.times = []; setStep(0); },
  'cancel-sheet': () => openSheet('¿Cancelar el pedido?', `<p class="muted" style="margin-bottom:20px">Todavía no tiene costo. Una vez que el profesional sale hacia el domicilio, la cancelación puede tener cargo.</p><button class="btn block" data-action="cancel">Sí, cancelar</button><button class="btn light block" style="margin-top:8px" data-action="close-sheet" data-force>Mantener pedido</button>`),
  cancel: () => { state.active = null; syncTimer(); closeSheet(); location.hash = '#/'; toast('Pedido cancelado'); },

  star: (el) => {
    const n = Number(el.dataset.n);
    el.closest('form').dataset.stars = n;
    document.querySelectorAll('.starinput button').forEach((b) => {
      b.classList.toggle('on', Number(b.dataset.n) <= n);
      b.setAttribute('aria-checked', Number(b.dataset.n) === n);
    });
    $('#rateLabel').textContent = RATE_LABELS[n];
    $('#rateSubmit').disabled = false;
  },
  tag: (el) => el.setAttribute('aria-pressed', el.classList.toggle('on')),
  tip: (el) => single('#tips', el)
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.filters.q = e.target.value; renderSearchBody(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

const forms = {
  'home-search': (form) => { resetFilters({ q: form.q.value.trim() }); location.hash = '#/buscar'; },
  order: () => {
    const p = proById(state.cart.proId);
    const job = {
      proId: p.id, items: state.cart.items.map((i) => p.services[i]), total: cartTotal() + APP_FEE,
      address: ADDRESSES[state.addr].text, pay: state.checkout.pay, step: 0, progress: 0, times: [nowTime()],
      pin: String(Math.floor(1000 + Math.random() * 9000))
    };
    state.active = job;
    state.cart = { proId: null, items: [] };
    syncTimer();
    location.hash = '#/seguimiento';
    // Simulates the professional accepting the request a few seconds later.
    setTimeout(() => { if (state.active === job && job.step === 0) setStep(1); }, 5000);
  },
  rate: (form) => {
    const stars = Number(form.dataset.stars);
    if (form.dataset.job === 'active') {
      const a = state.active;
      state.jobs.unshift({ id: 'j' + Date.now(), proId: a.proId, title: a.items[0][0], date: 'Hoy', price: a.total, rating: stars });
      state.active = null;
    } else {
      state.jobs.find((j) => j.id === form.dataset.job).rating = stars;
    }
    location.hash = '#/actividad';
    toast('Calificación enviada. Gracias.');
  }
};

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  forms[form.dataset.form](form);
});

syncTimer();
render();
</script>
</body>
</html>
